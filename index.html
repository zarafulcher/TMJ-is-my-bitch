}
function startFromFind(tid, nodeId){
  const t = S.tools[tid]; if(!t) return;
  if(!(S.settings.askRatings && nodeId && nodeId!==S.rootId)){ play([tid], null, { nodeId }); return; }
  const session = uid();
  openRating({ title:'How strong is it right now?', sub:pathLabel(nodeId),
    onPick:v=>{ logEvent({ type:'rating', phase:'before', session, nodeId, branch:pathLabel(nodeId), toolId:tid, tool:t.title, value:v });
      play([tid], null, { session, nodeId, rate:true }); },
    onSkip:()=>play([tid], null, { nodeId }) });
}

/* ============================================================
   Sync across devices through a private GitHub repository.
   The token and repository live only in this device's local
   settings: never in the plan, backups, or the app's code.
   ============================================================ */
const SYNC_FILE = 'ledger.json';
const SYNC = { busy:false, again:false, timer:null, applying:false, err:null, last:0 };
try{ SYNC.last = +localStorage.getItem('ledger-sync-last') || 0; }catch(e){}

function syncCfg(){
  try{ const c = JSON.parse(localStorage.getItem('ledger-sync') || 'null'); return c && c.repo && c.token ? c : null; }
  catch(e){ return null; }
}
function deviceLabel(){
  const u = navigator.userAgent || '';
  return /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Macintosh/.test(u) ? 'Mac' : 'browser';
}
function b64encode(str){
  const bytes = new TextEncoder().encode(str); let bin = '';
  for(let i=0; i<bytes.length; i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000));
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(String(b64).replace(/\s/g,'')), bytes = new Uint8Array(bin.length);
  for(let i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
// JSON with sorted keys, so two copies of the same data always compare equal
function stable(v){
  if(v === undefined) return 'undefined';
  if(v === null || typeof v !== 'object') return JSON.stringify(v);
  if(Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  return '{' + Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',') + '}';
}
const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
const same = (a, b) => stable(a) === stable(b);

class SyncError extends Error{ constructor(msg, auth, conflict){ super(msg); this.auth = !!auth; this.conflict = !!conflict; } }
function ghError(status){
  if(status===401) return new SyncError('GitHub didn’t accept the token. It may have expired: paste a new one below.', true);
  if(status===403) return new SyncError('The token isn’t allowed to change this repository. It needs Contents: Read and write.', true);
  if(status===404) return new SyncError('Can’t find that repository with this token. Check the name and that the token was given access to it.', true);
  if(status===409 || status===422) return new SyncError('Another device saved at the same moment.', false, true);
  return new SyncError('GitHub had a problem (' + status + '). Trying again later.');
}
async function gh(cfg, path, opts){
  opts = opts || {};
  // Only Authorization, Accept and Content-Type, which GitHub accepts from web pages.
  const headers = { 'Authorization':'Bearer ' + cfg.token, 'Accept': opts.accept || 'application/vnd.github+json' };
  if(opts.body) headers['Content-Type'] = 'application/json';
  const method = opts.method || 'GET';
  const url = 'https://api.github.com' + path + (method === 'GET' ? (path.includes('?') ? '&' : '?') + '_=' + Date.now() : '');   // never a stale cached copy
  let res;
  try{ res = await fetch(url, { method, headers, body: opts.body ? JSON.stringify(opts.body) : undefined }); }
  catch(e){ throw new SyncError('Offline. Changes will sync when you’re back online.'); }
  return res;
}
async function ghRepo(cfg){
  const res = await gh(cfg, '/repos/' + cfg.repo);
  if(!res.ok) throw ghError(res.status);
  return res.json();
}
async function ghGet(cfg){
  const path = '/repos/' + cfg.repo + '/contents/' + SYNC_FILE;
  const res = await gh(cfg, path);
  if(res.status === 404) return null;
  if(!res.ok) throw ghError(res.status);
  const j = await res.json();
  let text;
  if(j.content && j.encoding === 'base64') text = b64decode(j.content);
  else {   // files over 1 MB come back without inline content
    const raw = await gh(cfg, path, { accept:'application/vnd.github.raw+json' });
    if(!raw.ok) throw ghError(raw.status);
    text = await raw.text();
  }
  return { sha:j.sha, data:JSON.parse(text) };
}
async function ghPut(cfg, data, sha){
  const body = { message:'Ledger sync from ' + deviceLabel(), content:b64encode(stable(data)) };
  if(sha) body.sha = sha;
  const res = await gh(cfg, '/repos/' + cfg.repo + '/contents/' + SYNC_FILE, { method:'PUT', body });
  if(!res.ok) throw ghError(res.status);
  return (await res.json()).content.sha;
}

/* ---------- three-way merge: base = the last copy both sides agreed on ---------- */
const ID_LISTS = new Set(['childIds','toolIds','itemIds']);
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
function mergeIdList(base, local, remote){
  const b = new Set(base||[]), l = new Set(local), r = new Set(remote);
  const out = local.filter(id => !(b.has(id) && !r.has(id)));          // drop what the other side removed
  remote.forEach(id => { if(!b.has(id) && !l.has(id) && !out.includes(id)) out.push(id); });   // add what it added
  return out;
}
function merge3(base, local, remote, key){
  if(same(local, remote)) return clone(local);
  if(same(local, base)) return clone(remote);
  if(same(remote, base)) return clone(local);
  if(ID_LISTS.has(key) && Array.isArray(local) && Array.isArray(remote)) return mergeIdList(base, local, remote);
  if(isObj(local) && isObj(remote)){
    const b = isObj(base) ? base : {}, out = {};
    new Set([...Object.keys(b), ...Object.keys(local), ...Object.keys(remote)]).forEach(k=>{
      const inL = k in local, inR = k in remote, inB = k in b;
      if(!inL && !inR) return;
      if(!inL){ if(!(inB && same(remote[k], b[k]))) out[k] = clone(remote[k]); return; }   // a change beats a deletion
      if(!inR){ if(!(inB && same(local[k], b[k]))) out[k] = clone(local[k]); return; }
      const v = merge3(inB ? b[k] : undefined, local[k], remote[k], k);
      if(v !== undefined) out[k] = v;
    });
    return out;
  }
  return clone(local);   // the same value changed both ways: this device wins
}
function mergeSet(base, local, remote, keyOf){
  const b = new Set(base.map(keyOf)), l = new Map(local.map(x=>[keyOf(x),x])), r = new Map(remote.map(x=>[keyOf(x),x]));
  const out = [];
  new Set([...l.keys(), ...r.keys()]).forEach(k=>{
    const inB = b.has(k), inL = l.has(k), inR = r.has(k);
    if(inB ? (inL && inR) : (inL || inR)) out.push(clone(l.get(k) || r.get(k)));
  });
  return out;
}
function logTriples(logs){
  const out = [];
  Object.entries(logs||{}).forEach(([d, byR])=>Object.entries(byR||{}).forEach(([r, ids])=>(ids||[]).forEach(t=>out.push(d+'|'+r+'|'+t))));
  return out;
}
function mergeStates(base, local, remote){
  base = base || {};
  const out = {};
  new Set([...Object.keys(local), ...Object.keys(remote)]).forEach(k=>{
    if(k==='events'){
      out.events = mergeSet(base.events||[], local.events||[], remote.events||[], e=>e.id).sort((a,b)=>a.ts-b.ts);
    } else if(k==='logs'){
      out.logs = {};
      mergeSet(logTriples(base.logs), logTriples(local.logs), logTriples(remote.logs), x=>x).forEach(s=>{
        const [d, r, t] = s.split('|');
        ((out.logs[d] = out.logs[d] || {})[r] = out.logs[d][r] || []).push(t);
      });
    } else if(k==='routines'){
      const toMap = a => Object.fromEntries((a||[]).map(r=>[r.id, r]));
      const m = merge3(toMap(base.routines), toMap(local.routines), toMap(remote.routines), 'routines') || {};
      const order = (local.routines||[]).map(r=>r.id).concat((remote.routines||[]).map(r=>r.id));
      out.routines = [...new Set(order)].filter(id=>m[id]).map(id=>m[id]);
    } else {
      const v = merge3(base[k], local[k], remote[k], k);
      if(v !== undefined) out[k] = v;
    }
  });
  return tidy(out, local);
}
// Repair references after a merge so nothing points at something deleted and no branch is orphaned.
function tidy(s, fallback){
  s.nodes = s.nodes || {}; s.tools = s.tools || {};
  if(!s.rootId || !s.nodes[s.rootId]){ s.rootId = fallback.rootId; s.nodes[s.rootId] = s.nodes[s.rootId] || clone(fallback.nodes[fallback.rootId]); }
  const seen = new Set([s.rootId]);
  const walk = id => {
    const n = s.nodes[id];
    n.toolIds = [...new Set((n.toolIds||[]).filter(t=>s.tools[t]))];
    n.childIds = [...new Set((n.childIds||[]).filter(c=>s.nodes[c] && !seen.has(c)))];
    n.childIds.forEach(c=>{ seen.add(c); s.nodes[c].parentId = id; });
    n.childIds.forEach(walk);
  };
  walk(s.rootId);
  Object.values(s.nodes).forEach(n=>{
    if(seen.has(n.id)) return;
    const p = s.nodes[n.parentId] && seen.has(n.parentId) ? n.parentId : s.rootId;
    s.nodes[p].childIds.push(n.id); n.parentId = p; seen.add(n.id); walk(n.id);
  });
  (s.routines||[]).forEach(r=>{ r.itemIds = [...new Set((r.itemIds||[]).filter(t=>s.tools[t]))]; });
  return s;
}

/* ---------- running a sync ---------- */
function scheduleSync(ms){
  if(!syncCfg() || SYNC.applying) return;
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(()=>syncNow(), ms == null ? 6000 : ms);
}
function hasContent(s){
  return (s.events||[]).length || (s.routines||[]).length || Object.keys(s.tools||{}).length > 1 || Object.keys(s.nodes||{}).length > 8;
}
async function applyMerged(next){
  migrate(next);
  SYNC.applying = true;
  try{ S = next; await idbPut('doc','state', S); } finally { SYNC.applying = false; }
  const a = document.activeElement;
  const typing = a && $('#app').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
  if(!typing && !playerOpen()) render();
}
async function syncNow(retry){
  const cfg = syncCfg(); if(!cfg) return;
  if(SYNC.busy){ SYNC.again = true; return; }
  SYNC.busy = true; clearTimeout(SYNC.timer); updateSyncStatus();
  try{
    if(_saveTimer) await flush();
    const remote = await ghGet(cfg);
    const base = await idbGet('doc','syncbase');
    let merged;
    if(!remote) merged = clone(S);
    else if(!base) merged = clone(remote.data);   // only reached if set-up was interrupted: trust the synced copy
    else merged = mergeStates(base, S, remote.data);
    if(!same(merged, S)) await applyMerged(merged);
    if(!remote || !same(merged, remote.data)) await ghPut(cfg, merged, remote && remote.sha);
    await idbPut('doc','syncbase', clone(merged));
    SYNC.err = null; SYNC.last = Date.now();
    try{ localStorage.setItem('ledger-sync-last', String(SYNC.last)); }catch(e){}
  }catch(e){
    if(e.conflict && !retry){ SYNC.busy = false; return syncNow(true); }
    SYNC.err = { msg: e.message || String(e), auth: !!e.auth };
  }finally{
    SYNC.busy = false; updateSyncStatus();
    if(SYNC.again){ SYNC.again = false; scheduleSync(800); }
  }
}
async function connectSync(){
  const repo = ($('#sync_repo').value || '').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,'');
  const token = ($('#sync_token').value || '').trim();
  const say = (m, bad) => { const el = $('#sync_msg'); if(el){ el.textContent = m; el.classList.toggle('warn', !!bad); } };
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){ say('Type the repository as yourname/repository, for example zarafulcher/ledger-data.', true); return; }
  if(!token){ say('Paste the access token.', true); return; }
  const cfg = { repo, token };
  say('Checking…');
  try{
    const info = await ghRepo(cfg);
    if(info.private !== true){ say('That repository is public, so anyone could read your log. Make it private on GitHub (Settings → Danger Zone → Change visibility), or use a new private one.', true); return; }
    const prev = syncCfg();
    if(prev && prev.repo === repo && await idbGet('doc','syncbase')){
      // already connected: just swap in the new token and carry on
      try{ localStorage.setItem('ledger-sync', JSON.stringify(cfg)); }catch(e){}
      SYNC.err = null; await syncNow(); render(); toast(SYNC.err ? 'Still not syncing' : 'Token updated'); return;
    }
    const remote = await ghGet(cfg);
    try{ localStorage.setItem('ledger-sync', JSON.stringify(cfg)); }catch(e){ say('This browser won’t save settings.', true); return; }
    if(!remote){
      await ghPut(cfg, S, null);
      await idbPut('doc','syncbase', clone(S));
      SYNC.err = null; SYNC.last = Date.now(); try{ localStorage.setItem('ledger-sync-last', String(SYNC.last)); }catch(e){}
      toast('Connected'); render(); return;
    }
    if(!hasContent(S)){ await adoptRemote(remote); return; }
    SYNC._pending = remote;
    openSheet(`<h2>Both have data</h2>
      <div class="hint" style="margin-top:6px">The synced copy already has a library or log, and so does this device. Pick which one to keep. To combine them, cancel, export the library from one as a spreadsheet and paste it into the other, then connect again.</div>
      <div style="height:16px"></div>
      <button class="btn" data-act="syncuseremote">Use the synced copy here</button>
      <div style="height:9px"></div>
      <button class="btn ghost" data-act="syncuselocal">Replace the synced copy with this device’s</button>
      <button class="btn quiet" data-act="synccancel">Cancel</button>`);
  }catch(e){ say(e.message || String(e), true); }
}
async function adoptRemote(remote){
  await applyMerged(clone(remote.data));
  await idbPut('doc','syncbase', clone(remote.data));
  SYNC.err = null; SYNC.last = Date.now(); try{ localStorage.setItem('ledger-sync-last', String(SYNC.last)); }catch(e){}
  closeSheet(); findStack = []; toast('Connected'); render();
}
async function replaceRemote(){
  const cfg = syncCfg(), remote = SYNC._pending;
  try{
    await ghPut(cfg, S, remote && remote.sha);
    await idbPut('doc','syncbase', clone(S));
    SYNC.err = null; SYNC.last = Date.now(); try{ localStorage.setItem('ledger-sync-last', String(SYNC.last)); }catch(e){}
    closeSheet(); toast('Connected'); render();
  }catch(e){ alert(e.message || String(e)); }
}
async function disconnectSync(){
  if(!confirm('Stop syncing this device? Everything stays here and in the repository; they just stop updating each other.')) return;
  try{ localStorage.removeItem('ledger-sync'); localStorage.removeItem('ledger-sync-last'); }catch(e){}
  await idbDel('doc','syncbase');
  SYNC.err = null; SYNC.last = 0; render();
}
function syncStatusText(){
  if(!syncCfg()) return '';
  if(SYNC.busy) return 'Syncing…';
  if(SYNC.err) return SYNC.err.msg;
  if(!SYNC.last) return 'Not synced yet.';
  const d = new Date(SYNC.last);
  return 'Last synced ' + (dayKey(d)===today() ? 'at ' + clock(SYNC.last) : d.toLocaleDateString('en-AU',{ day:'numeric', month:'short' }) + ' at ' + clock(SYNC.last)) + '.';
}
function updateSyncStatus(){
  const el = document.getElementById('sync_status');
  if(el){ el.textContent = syncStatusText(); el.classList.toggle('warn', !!SYNC.err); }
}
function syncSettingsHTML(){
  const cfg = syncCfg();
  if(cfg){
    return `<div class="section">${label('Sync across devices','t1')}
      <div class="card"><div class="title" style="font-size:16px">Syncing with ${esc(cfg.repo)}</div>
        <div class="meta" id="sync_status">${esc(syncStatusText())}</div></div>
      ${SYNC.err && SYNC.err.auth ? `<label class="f"><span>New access token</span><input type="text" id="sync_token" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="github_pat_…"></label>
        <input type="hidden" id="sync_repo" value="${esc(cfg.repo)}"><div style="height:9px"></div>
        <button class="btn" data-act="syncconnect">Update token</button><div class="hint" id="sync_msg"></div>` : ''}
      <div style="height:9px"></div>
      <div class="btnrow"><button class="btn ghost" data-act="syncnow">Sync now</button><button class="btn ghost" data-act="syncoff">Stop syncing</button></div>
      <div class="hint">Syncs when you open Ledger and a few seconds after each change. Videos and photos stay on the device you added them on; YouTube links play everywhere. Every sync is saved in the repository’s history, so older versions can be recovered there.</div>
    </div>`;
  }
  return `<div class="section">${label('Sync across devices','t1')}
    <div class="hint" style="margin:0 0 4px">Keeps your phone, Mac and any other device in step through a private GitHub repository of your own. Do this once on each device.</div>
    <label class="f"><span>Private repository</span><input type="text" id="sync_repo" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="zarafulcher/ledger-data"></label>
    <label class="f"><span>Access token</span><input type="text" id="sync_token" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="github_pat_…"></label>
    <div style="height:12px"></div>
    <button class="btn" data-act="syncconnect">Connect</button>
    <div class="hint" id="sync_msg"></div>
    <div class="hint"><b>Setting up on github.com, once:</b><br>
      1. New repository, named for example ledger-data, set to <b>Private</b>.<br>
      2. Profile picture → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token.<br>
      3. Repository access: Only select repositories → ledger-data. Permissions → Repository permissions → Contents: <b>Read and write</b>.<br>
      4. Copy the token and paste it here with the repository name. Use the same token on each device.</div>
  </div>`;
}

/* ============================================================
   Events
   ============================================================ */
document.addEventListener('click', async e=>{
  if(e.target.closest('[data-close]')){ _toolCtx = null; closeSheet(); return; }

  const tabBtn = e.target.closest('#tabs button');
  if(tabBtn){ tab = tabBtn.dataset.tab; if(tab==='find') findQuery = ''; render(); toTop(); return; }

  // in-sheet toggles
  const toggle = e.target.closest('#r_days button, #r_levels button');
  if(toggle){ toggle.setAttribute('aria-pressed', toggle.getAttribute('aria-pressed')!=='true'); return; }
  const kindBtn = e.target.closest('#kindseg button');
  if(kindBtn){
    const prev = readToolForm(_toolCtx && _toolCtx.id ? S.tools[_toolCtx.id] : {});
    [...$('#kindseg').children].forEach(b=>b.setAttribute('aria-pressed', b===kindBtn));
    renderKindFields(kindBtn.dataset.k, prev);
    return;
  }

  const el = e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  const id = el.dataset.id, act = el.dataset.act;

  switch(act){
    /* today */
    case 'level': setLevel(id); break;
    case 'playroutine': {
      const r = S.routines.find(x=>x.id===id);
      const ids = r.itemIds.filter(i=>S.tools[i]), d = doneToday(r.id), left = ids.filter(i=>!d.includes(i));
      play(left.length && left.length < ids.length ? left : ids, r.id);
      break;
    }
    case 'tick': {
      const rc = el.getBoundingClientRect(), was = doneToday(el.dataset.r).includes(id);
      toggleDone(el.dataset.r, id);
      if(!was) burst(rc.left + rc.width/2, rc.top + rc.height/2);
      break;
    }
    case 'playfrom': {
      const r = S.routines.find(x=>x.id===el.dataset.r);
      const ids = r.itemIds.filter(i=>S.tools[i]);
      play(ids.slice(ids.indexOf(id)), r.id);
      break;
    }
    case 'toggleopen': {
      const r = S.routines.find(x=>x.id===id);
      const due = r.days.includes(dow()) && r.levels.includes(S.level);
      openState[id] = !(openState[id] != null ? openState[id] : due);
      render();
      break;
    }
    case 'quickadd': quickAdd(); break;
    case 'theme': applyTheme(id); render(); break;
    case 'emojipick': { const inp = document.getElementById('e_emoji'); if(inp) inp.value = el.dataset.e; break; }

    /* find */
    case 'playone': startFromFind(id, el.dataset.node || null); break;
    case 'findinto': findStack.push(id); render(); toTop(); break;
    case 'findback': findStack.pop(); render(); toTop(); break;
    case 'findjump': {
      const chain = []; let n = S.nodes[id];
      while(n){ chain.unshift(n.id); n = S.nodes[n.parentId]; }
      findStack = chain; findQuery = ''; render(); toTop(); break;
    }
    case 'quicklog': quickLog(id); break;

    /* ratings */
    case 'rate': {
      const v = +el.dataset.v;
      if(_rate && _rate.note){
        _rate.value = v;
        el.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b===el));
        $('#ratesave').disabled = false;
      } else if(_rate){ const cb = _rate.onPick; _rate = null; closeSheet(); cb(v); }
      break;
    }
    case 'ratesave': if(_rate && _rate.value!=null){ const r = _rate; _rate = null; const note = ($('#rate_note')||{}).value || ''; closeSheet(); r.onPick(r.value, note.trim()); } break;
    case 'rateskip': if(_rate){ const r = _rate; _rate = null; closeSheet(); if(r.onSkip) r.onSkip(); } break;
    case 'afterrate': {
      const c = P.ctx, t = S.tools[P.queue[0]];
      logEvent({ type:'rating', phase:'after', session:c.session, nodeId:c.nodeId, branch:pathLabel(c.nodeId), toolId:P.queue[0], tool:t?t.title:'', value:+el.dataset.v });
      closePlayer(); toast('Saved');
      break;
    }

    /* log */
    case 'delevent': {
      const ev = S.events.find(x=>x.id===id);
      if(ev && confirm('Delete this entry?\n\n' + describe(ev))){ S.events = S.events.filter(x=>x.id!==id); save(); render(); }
      break;
    }
    case 'exportlog': shareOrDownload('ledger-log-' + today() + '.csv', logCSV(), 'text/csv'); break;

    /* library and items */
    case 'newtool': editTool(null); break;
    case 'gobulk': closeSheet(); tab = 'build'; buildView = 'bulk'; render(); toTop(); break;
    case 'edittool': editTool(id, { id }); break;
    case 'savetool': await saveTool(id || null); break;
    case 'deltool': await deleteTool(id); break;
    case 'canceltool': { const c = _toolCtx; _toolCtx = null; closeSheet(); if(c && c.onCancel) c.onCancel(); break; }

    /* build */
    case 'buildview': buildView = id; render(); break;
    case 'toggleratings': S.settings.askRatings = !S.settings.askRatings; save(); render(); break;
    case 'export': exportPlan(); break;
    case 'import': importPlan(); break;
    case 'update': checkUpdate(); break;
    case 'syncconnect': connectSync(); break;
    case 'syncnow': syncNow(); break;
    case 'syncoff': disconnectSync(); break;
    case 'syncuseremote': if(SYNC._pending) adoptRemote(SYNC._pending); break;
    case 'syncuselocal': replaceRemote(); break;
    case 'synccancel': try{ localStorage.removeItem('ledger-sync'); }catch(e){} SYNC._pending = null; closeSheet(); render(); break;
    case 'gosync': tab = 'build'; buildView = 'settings'; render(); toTop(); break;

    /* branches */
    case 'editnode': editNode(id); break;
    case 'savenode': stashNodeLabel(id); save(); closeSheet(); render(); break;
    case 'addchild': addChild(id); break;
    case 'delnode': delNode(id); break;
    case 'nodedetach': stashNodeLabel(id); S.nodes[id].toolIds = S.nodes[id].toolIds.filter(x=>x!==el.dataset.t); save(); editNode(id); render(); break;
    case 'nodemove': {
      stashNodeLabel(id);
      const arr = S.nodes[id].toolIds, i = arr.indexOf(el.dataset.t), d = +el.dataset.d;
      if(i+d >= 0 && i+d < arr.length){ arr.splice(i+d, 0, arr.splice(i,1)[0]); save(); editNode(id); }
      break;
    }
    case 'nodeshift': {
      stashNodeLabel(id);
      const n = S.nodes[id], arr = S.nodes[n.parentId].childIds, i = arr.indexOf(id), d = +el.dataset.d;
      if(i+d >= 0 && i+d < arr.length){ arr.splice(i+d, 0, arr.splice(i,1)[0]); save(); editNode(id); render(); }
      break;
    }
    case 'attach':
      stashNodeLabel(id);
      pickTools(ids=>{ ids.forEach(t=>attachTool(id, t)); save(); editNode(id); render(); }, ()=>editNode(id));
      break;
    case 'newinnode':
      stashNodeLabel(id);
      editTool(null, { onSaved:tid=>{ attachTool(id, tid); save(); editNode(id); render(); }, onCancel:()=>editNode(id) });
      break;

    /* routines */
    case 'newroutine': editRoutine(null); break;
    case 'editroutine': editRoutine(id); break;
    case 'saveroutine': saveRoutine(id || null); break;
    case 'delroutine':
      if(confirm('Delete this routine? Its items stay in your library and your log keeps its history.')){
        S.routines = S.routines.filter(x=>x.id!==id); _draftRoutine = null; save(); closeSheet(); render();
      } break;
    case 'duproutine': {
      stashRoutineForm();
      const src = _draftRoutine;
      editRoutine(null, { id:null, name:src.name + ' (copy)', emoji:src.emoji||'', days:src.days.slice(), levels:src.levels.slice(), itemIds:src.itemIds.slice() });
      break;
    }
    case 'attachroutine':
      stashRoutineForm();
      pickTools(ids=>{ ids.forEach(t=>{ if(!_draftRoutine.itemIds.includes(t)) _draftRoutine.itemIds.push(t); }); reopenRoutine(id); }, ()=>reopenRoutine(id));
      break;
    case 'newinroutine':
      stashRoutineForm();
      editTool(null, { onSaved:tid=>{ _draftRoutine.itemIds.push(tid); reopenRoutine(id); }, onCancel:()=>reopenRoutine(id) });
      break;
    case 'rmove': {
      const i = +el.dataset.i, d = +el.dataset.d, arr = _draftRoutine.itemIds;
      if(i+d >= 0 && i+d < arr.length){ arr.splice(i+d, 0, arr.splice(i,1)[0]); $('#r_items').innerHTML = routineItems(_draftRoutine); }
      break;
    }
    case 'rdrop': _draftRoutine.itemIds.splice(+el.dataset.i, 1); $('#r_items').innerHTML = routineItems(_draftRoutine); break;

    /* picker */
    case 'picktoggle': {
      const i = _pick.ids.indexOf(id);
      if(i < 0) _pick.ids.push(id); else _pick.ids.splice(i,1);
      el.querySelector('.check').classList.toggle('on', i < 0);
      const b = $('#pickbtn'); b.disabled = !_pick.ids.length; b.textContent = _pick.ids.length ? 'Add ' + _pick.ids.length : 'Add';
      break;
    }
    case 'pickdone': { const p = _pick; _pick = null; closeSheet(); p.onPick(p.ids); break; }
    case 'pickcancel': { const p = _pick; _pick = null; closeSheet(); if(p && p.onCancel) p.onCancel(); break; }

    /* bulk */
    case 'bulkpaste': {
      const text = ($('#b_paste').value || '').trim();
      if(!text){ toast('Paste something first'); break; }
      const res = await importRows(rowsToObjects(parseDelimited(text)), bulkDefaults());
      if(res.added || res.updated) $('#b_paste').value = '';
      reportImport(res);
      break;
    }
    case 'dltemplate': shareOrDownload('ledger-template.csv', templateCSV(), 'text/csv'); break;
    case 'exportlib': shareOrDownload('ledger-library-' + today() + '.csv', libraryCSV(), 'text/csv'); break;

    /* player */
    case 'closeplayer': closePlayer(); break;
  }
});

document.addEventListener('input', e=>{
  const id = e.target.id;
  if(id==='findq'){ findQuery = e.target.value; const b = $('#findbody'); if(b) b.innerHTML = findBody(); }
  if(id==='libq'){ libQuery = e.target.value; const b = $('#libbody'); if(b) b.innerHTML = libBody(); }
  if(id==='pickq'){ $('#picklist').innerHTML = pickList(e.target.value); }
  if(id==='t_url'){
    $('#t_detect').textContent = detectLine(e.target.value);
    const f = $('#t_ytfields'); if(f) f.style.display = ytInfo(normaliseUrl(e.target.value)) ? 'block' : 'none';
  }
});
document.addEventListener('change', async e=>{
  const id = e.target.id;
  if(id==='t_file') draftFile = e.target.files[0] || null;
  if(id==='b_files'){
    const files = [...e.target.files]; if(!files.length) return;
    const st = $('#b_status'); if(st) st.textContent = 'Saving ' + files.length + ' file' + (files.length===1?'':'s') + '…';
    const n = await importFiles(files, bulkDefaults());
    e.target.value = '';
    reportImport({ added:n, updated:0, skipped:[] });
  }
  if(id==='b_csv'){
    const f = e.target.files[0]; if(!f) return;
    const res = await importRows(rowsToObjects(parseDelimited(await f.text())), bulkDefaults());
    e.target.value = '';
    reportImport(res);
  }
});

$('#pclose').onclick = closePlayer;
$('#pnext').onclick = next;
$('#pprev').onclick = prev;
$('#ptoggle').onclick = togglePause;
$('#ptap').onclick = togglePause;
$('#pmute').onclick = ()=>{
  const v = V(); v.muted = !v.muted;
  if(ytPlayer){ try{ v.muted ? ytPlayer.mute() : ytPlayer.unMute(); }catch(e){} }
  $('#pmute').textContent = v.muted ? '⊘' : '♪';
};
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden' && _saveTimer) flush();
  if(document.visibilityState==='hidden' && SYNC.timer && syncCfg()) syncNow();
  if(document.visibilityState==='visible' && syncCfg() && Date.now() - SYNC.last > 20000) syncNow();
  if(document.visibilityState==='visible' && playerOpen()) requestWake();
});

/* ---------- boot ---------- */
(async function(){
  syncThemeColor();
  await loadState();
  try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  render();
  // measure clips saved before v2 so routine lengths and finish times are known
  for(const t of Object.values(S.tools)){
    if(t.mediaId && !(t.mediaIds && Object.keys(t.mediaIds).length)){
      try{ if(await idbGet('media', t.mediaId)){ t.mediaIds = { [DEVICE]: t.mediaId }; save(); } }catch(e){}
    }
  }
  if(syncCfg()) setTimeout(()=>syncNow(), 300);
  Object.values(S.tools).filter(t=>t.kind==='video' && !t.dur && hasMedia(t))
    .reduce((p,t)=>p.then(()=>probeVideo(t)), Promise.resolve())
    .then(()=>{ if(tab==='today' && !$('#sheet').classList.contains('open')) render(); });
  if('serviceWorker' in navigator){
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(!had || window.__reloading) return;
      if(playerOpen()){ P.reloadAfter = true; return; }
      window.__reloading = true; location.reload();
    });
  }
})();
