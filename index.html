<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="theme-color" content="#131c1b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Ledger</title>
<style>
:root{
  --bg:#131c1b;
  --surface:#1c2726;
  --surface2:#243230;
  --line:#34433f;
  --text:#ece9e1;
  --muted:#93a29d;
  --accent:#aeb9ec;
  --accent-ink:#131c1b;
  --done:#84b8aa;
  --warn:#e6a6a0;
  --r:14px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --serif:ui-serif,"New York",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  margin:0;padding:0;overscroll-behavior-y:none;
  height:100%;height:100dvh;
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:17px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- layout ---------- */
#app{
  flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  width:100%;max-width:600px;margin:0 auto;padding:0 18px 28px;
}
.top{padding:calc(env(safe-area-inset-top) + 22px) 0 10px}
.top h1{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.01em;margin:0}
.top .sub{color:var(--muted);font-size:15px;margin-top:2px}
.section{margin:26px 0 0}
.section > h2{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 10px}

/* ---------- rows ---------- */
.row{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px;margin-bottom:9px;min-height:62px;
}
.row:active{background:var(--surface2)}
.row .body{flex:1;min-width:0}
.row .title{font-size:17px;line-height:1.3}
.row .meta{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--muted);font-size:20px;flex:none}
.row.flat{background:none;border-color:transparent;padding-left:0;padding-right:0;min-height:48px;margin-bottom:0}
.glyph{
  flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:var(--surface2);color:var(--muted);font-size:17px;
}
.glyph.on{background:var(--accent);color:var(--accent-ink)}
.glyph.done{background:var(--done);color:var(--accent-ink)}

/* ---------- question screen ---------- */
.q{font-family:var(--serif);font-size:34px;line-height:1.15;font-weight:500;margin:14px 0 22px;letter-spacing:-.015em}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;min-height:26px}
.crumb button{color:var(--accent)}

/* ---------- buttons ---------- */
.btn{
  display:block;width:100%;text-align:center;background:var(--accent);color:var(--accent-ink);
  border-radius:var(--r);padding:16px;font-size:17px;font-weight:600;
}
.btn:active{opacity:.82}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text);font-weight:500}
.btn.quiet{background:none;color:var(--muted);font-weight:500;padding:12px}
.btn.danger{background:none;border:1px solid var(--line);color:var(--warn)}
.btn[disabled]{opacity:.4}
.btnrow{display:flex;gap:9px}
.btnrow .btn{flex:1}

/* ---------- forms ---------- */
label.f{display:block;margin:16px 0 0}
label.f > span{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=number],input[type=url],textarea,select{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:13px 14px;font-size:17px;appearance:none;
}
textarea{min-height:120px;resize:vertical;line-height:1.5}
input[type=file]{width:100%;font-size:15px;color:var(--muted);padding:10px 0}
.seg{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px}
.seg button{flex:1;padding:11px 4px;border-radius:8px;font-size:15px;color:var(--muted);text-align:center}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.days{display:flex;gap:6px}
.days button{
  flex:1;aspect-ratio:1;border-radius:50%;border:1px solid var(--line);
  font-size:14px;color:var(--muted);display:grid;place-items:center;
}
.days button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.hint{font-size:14px;color:var(--muted);line-height:1.5;margin:10px 0 0}
.empty{
  border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;
  color:var(--muted);font-size:15px;line-height:1.5;
}
.empty b{color:var(--text);font-weight:600;display:block;margin-bottom:4px;font-size:17px}

/* ---------- tabs ---------- */
#tabs{
  flex:0 0 auto;z-index:40;
  display:flex;background:rgba(19,28,27,.93);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
#tabs button{flex:1;padding:9px 0 8px;color:var(--muted);font-size:11px;display:grid;gap:3px;justify-items:center}
#tabs button span.ic{font-size:19px;line-height:1}
#tabs button[aria-current=page]{color:var(--accent)}

/* ---------- sheet ---------- */
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.open{display:block}
#sheet .scrim{position:absolute;inset:0;background:rgba(8,13,12,.6)}
#sheet .panel{
  position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;
  background:var(--bg);border-top-left-radius:20px;border-top-right-radius:20px;
  border-top:1px solid var(--line);padding:8px 18px calc(30px + env(safe-area-inset-bottom));
}
#sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
#sheet h2{font-family:var(--serif);font-size:24px;font-weight:600;margin:4px 0 2px}

/* ---------- player ---------- */
#player{position:fixed;inset:0;height:100dvh;z-index:80;background:#0a0f0e;display:none;flex-direction:column}
#player.open{display:flex}
#pbar{height:3px;background:rgba(255,255,255,.14);flex:none}
#pbar i{display:block;height:100%;background:var(--accent);width:0}
#pstage{flex:1;position:relative;display:grid;place-items:center;overflow:hidden}
#pstage video,#pstage img{max-width:100%;max-height:100%;width:auto;height:auto;display:none}
#ptext{
  display:none;position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
#ptext.on{display:block}
#ptextin{
  box-sizing:border-box;min-height:100%;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 76px) 24px 28px;
}
#ptextbody{
  width:100%;max-width:34ch;
  font-family:var(--serif);font-size:clamp(19px,5.4vw,26px);line-height:1.45;
  white-space:pre-wrap;overflow-wrap:break-word;hyphens:auto;
}
#ptext.caption{top:auto;bottom:0;overflow:visible;background:linear-gradient(transparent,rgba(10,15,14,.92) 38%)}
#ptext.caption #ptextin{min-height:0;padding:26px 22px calc(20px + env(safe-area-inset-bottom))}
#ptext.caption #ptextbody{font-size:18px;max-width:46ch;font-family:var(--sans)}
#phead{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:linear-gradient(rgba(10,15,14,.85),transparent)}
#phead .name{flex:1;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#phead .count{font-size:13px;color:var(--muted)}
#phead button{font-size:20px;color:var(--muted);padding:4px 6px}
#ptap{position:absolute;inset:0}
#ppaused{position:absolute;inset:0;display:none;place-items:center;background:rgba(10,15,14,.55);font-size:15px;color:var(--text);pointer-events:none;text-align:center;padding:20px}
#ppaused.on{display:grid}
#pfoot{flex:none;display:flex;gap:9px;padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
#pfoot button{flex:1;background:rgba(255,255,255,.07);border-radius:12px;padding:15px;text-align:center;font-size:15px}
#pfoot button.main{background:var(--accent);color:var(--accent-ink);font-weight:600;flex:1.6}
#pdone{display:none;padding:30px 22px;text-align:center}
#pdone.on{display:block}

.check{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent;font-size:15px}
.check.on{background:var(--done);border-color:var(--done);color:var(--accent-ink)}
.tag{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 9px;margin:6px 6px 0 0}
.bar{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--done)}
@media (prefers-reduced-motion:no-preference){
  #pbar i,.bar i{transition:width .25s linear}
}
</style>
</head>
<body>
<main id="app"></main>

<nav id="tabs">
  <button data-tab="today"><span class="ic">◐</span>Today</button>
  <button data-tab="find"><span class="ic">◇</span>Find</button>
  <button data-tab="library"><span class="ic">≡</span>Library</button>
  <button data-tab="build"><span class="ic">⚙</span>Build</button>
</nav>

<div id="sheet" role="dialog" aria-modal="true">
  <div class="scrim" data-close></div>
  <div class="panel"><div class="grab"></div><div id="sheetbody"></div></div>
</div>

<div id="player">
  <div id="pbar"><i></i></div>
  <div id="pstage">
    <video id="pvideo" playsinline webkit-playsinline preload="auto"></video>
    <img id="pimg" alt="">
    <div id="ptext"><div id="ptextin"><div id="ptextbody"></div></div></div>
    <div id="ptap"></div>
    <div id="ppaused">Paused. Tap to continue.</div>
    <div id="phead">
      <button id="pclose" aria-label="Close">✕</button>
      <div class="name" id="pname"></div>
      <div class="count" id="pcount"></div>
      <button id="pmute" aria-label="Mute">♪</button>
    </div>
  </div>
  <div id="pdone"></div>
  <div id="pfoot">
    <button id="pprev">Back</button>
    <button id="ptoggle" class="main">Pause</button>
    <button id="pnext">Skip</button>
  </div>
</div>
<script>
/* ============================================================
   Ledger — personal rehab index, triage and routine player.
   All data lives on this device: IndexedDB for the plan, a
   separate object store for video and photo files.
   ============================================================ */

const DB_NAME = 'ledger', DB_VER = 1;
let _db = null;

function openDB(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res, rej)=>{
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = ()=>{
      const db = r.result;
      if(!db.objectStoreNames.contains('doc')) db.createObjectStore('doc');
      if(!db.objectStoreNames.contains('media')) db.createObjectStore('media');
    };
    r.onsuccess = ()=>{ _db = r.result; res(_db); };
    r.onerror = ()=> rej(r.error);
  });
}
function tx(store, mode){ return openDB().then(db => db.transaction(store, mode).objectStore(store)); }
function idbGet(store, key){
  return tx(store,'readonly').then(s => new Promise((res,rej)=>{
    const r = s.get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  }));
}
function idbPut(store, key, val){
  return tx(store,'readwrite').then(s => new Promise((res,rej)=>{
    const r = s.put(val, key); r.onsuccess=()=>res(true); r.onerror=()=>rej(r.error);
  }));
}
function idbDel(store, key){
  return tx(store,'readwrite').then(s => new Promise((res,rej)=>{
    const r = s.delete(key); r.onsuccess=()=>res(true); r.onerror=()=>rej(r.error);
  }));
}

/* ---------- state ---------- */
let S = null;                 // the whole plan document
const urlCache = new Map();   // mediaId -> object URL

const uid = () => Math.random().toString(36).slice(2,10);
const today = () => new Date().toISOString().slice(0,10);
const dow = () => new Date().getDay(); // 0 Sun .. 6 Sat
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function seed(){
  const root = uid();
  const nodes = {};
  nodes[root] = { id:root, label:"What's going on?", childIds:[], toolIds:[] };
  const branches = ['Jaw and face','Neck and shoulders','Low back and core',
                    'Hips and knees','Wrists and hands','Whole-body flare','Head and mood'];
  branches.forEach(label=>{
    const id = uid();
    nodes[id] = { id, label, childIds:[], toolIds:[], parentId:root };
    nodes[root].childIds.push(id);
  });
  const t = uid();
  const tools = {};
  tools[t] = {
    id:t, title:'How this app works', kind:'text', seconds:30, tags:['start here'],
    text:"Every branch here is yours to change.\n\nBuild tab → Question tree: add a branch for anything new, nest it as deep as you like.\n\nLibrary tab: add a video, a photo or written instructions, then attach it to any branch.\n\nBuild tab → Routines: put items in order, pick the days, and Today will play them back to back."
  };
  nodes[root].toolIds.push(t);
  return { version:1, rootId:root, nodes, tools, routines:[], logs:{} };
}

async function loadState(){
  S = await idbGet('doc','state');
  if(!S){ S = seed(); await save(); }
  if(!S.logs) S.logs = {};
  return S;
}
let _saveTimer = null;
function save(){
  clearTimeout(_saveTimer);
  return new Promise(res=>{
    _saveTimer = setTimeout(async ()=>{ await idbPut('doc','state', S); res(true); }, 60);
  });
}

async function putMedia(file){
  const id = uid();
  await idbPut('media', id, { blob:file, type:file.type, name:file.name });
  return id;
}
async function mediaURL(id){
  if(!id) return null;
  if(urlCache.has(id)) return urlCache.get(id);
  const rec = await idbGet('media', id);
  if(!rec) return null;
  const url = URL.createObjectURL(rec.blob);
  urlCache.set(id, url);
  return url;
}

/* ---------- small helpers ---------- */
const $ = sel => document.querySelector(sel);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KIND = { video:{ic:'▶', word:'Video'}, image:{ic:'◼', word:'Photo'}, text:{ic:'¶', word:'Written'} };
const tool = id => S.tools[id];
const secondsLabel = n => n>=60 ? Math.round(n/60)+' min' : n+'s';

function toolMeta(t){
  const bits = [KIND[t.kind].word];
  if(t.kind==='video' && t.reps>1) bits.push('×'+t.reps);
  if(t.seconds) bits.push(secondsLabel(t.seconds));
  if(t.tags && t.tags.length) bits.push(t.tags.join(', '));
  return bits.join(' · ');
}
function routineProgress(r){
  const done = (S.logs[today()]||{})[r.id] || [];
  return { done: r.itemIds.filter(i=>done.includes(i)).length, total: r.itemIds.length };
}
function markDone(routineId, toolId){
  const d = today();
  S.logs[d] = S.logs[d] || {};
  S.logs[d][routineId] = S.logs[d][routineId] || [];
  if(!S.logs[d][routineId].includes(toolId)) S.logs[d][routineId].push(toolId);
  save();
}
function toggleDone(routineId, toolId){
  const d = today();
  S.logs[d] = S.logs[d] || {};
  const arr = S.logs[d][routineId] = S.logs[d][routineId] || [];
  const i = arr.indexOf(toolId);
  if(i<0) arr.push(toolId); else arr.splice(i,1);
  save(); render();
}
function streak(){
  let n = 0;
  const d = new Date();
  for(;;){
    const key = d.toISOString().slice(0,10);
    const day = S.logs[key];
    const due = S.routines.filter(r=>r.days.includes(d.getDay()) && r.itemIds.length);
    if(!due.length){ if(n===0 && key===today()){ d.setDate(d.getDate()-1); continue; } break; }
    const ok = due.every(r => (day&&day[r.id]||[]).length >= r.itemIds.length);
    if(!ok){ if(key===today()) { d.setDate(d.getDate()-1); continue; } break; }
    n++; d.setDate(d.getDate()-1);
  }
  return n;
}

/* ============================================================
   Views
   ============================================================ */
let tab = 'today';
let findStack = [];   // node ids, last = current
let findQuery = '';

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>{
    b.setAttribute('aria-current', b.dataset.tab===tab ? 'page' : 'false');
  });
  const app = $('#app');
  app.scrollTop = 0;
  if(tab==='today') app.innerHTML = viewToday();
  if(tab==='find') app.innerHTML = viewFind();
  if(tab==='library') app.innerHTML = viewLibrary();
  if(tab==='build') app.innerHTML = viewBuild();
  try{ window.scrollTo(0,0); }catch(e){}
}

/* ---------- Today ---------- */
function viewToday(){
  const due = S.routines.filter(r=>r.days.includes(dow()));
  const rest = S.routines.filter(r=>!r.days.includes(dow()));
  const st = streak();
  let h = `<div class="top"><h1>${DAYS[dow()]}, ${new Date().getDate()} ${new Date().toLocaleString('en',{month:'long'})}</h1>
    <div class="sub">${st>1 ? st+' days in a row' : 'One thing at a time'}</div></div>`;

  if(!S.routines.length){
    h += `<div class="empty"><b>No routines yet</b>Add your exercises in Library, then group them into a routine under Build. Today will play them in order.</div>
      <div style="height:12px"></div><button class="btn" data-act="newroutine">Make a routine</button>`;
    return h;
  }
  h += `<div class="section">`;
  if(!due.length) h += `<div class="empty">Nothing scheduled for ${DAYS[dow()]}. Anything below still plays if you want it.</div>`;
  due.forEach(r=>{ h += routineCard(r, true); });
  h += `</div>`;
  if(rest.length){
    h += `<div class="section"><h2>Other routines</h2>`;
    rest.forEach(r=>{ h += routineCard(r, false); });
    h += `</div>`;
  }
  return h;
}
function routineCard(r, expandable){
  const p = routineProgress(r);
  const complete = p.total && p.done>=p.total;
  let h = `<div class="row" style="flex-wrap:wrap">
    <div class="glyph ${complete?'done':'on'}">${complete?'✓':'▶'}</div>
    <div class="body">
      <div class="title">${esc(r.name)}</div>
      <div class="meta">${p.total? p.done+' of '+p.total+' done' : 'Empty — add exercises in Build'}</div>
      ${p.total?`<div class="bar"><i style="width:${Math.round(100*p.done/Math.max(p.total,1))}%"></i></div>`:''}
    </div>
    <button class="chev" data-act="playroutine" data-id="${r.id}" ${p.total?'':'disabled'} aria-label="Start ${esc(r.name)}" style="font-size:15px;color:var(--accent);padding:8px">${complete?'Again':'Start'}</button>`;
  if(expandable && p.total){
    h += `<div style="flex-basis:100%;padding-top:6px">`;
    r.itemIds.forEach(id=>{
      const t = tool(id); if(!t) return;
      const on = ((S.logs[today()]||{})[r.id]||[]).includes(id);
      h += `<button class="row flat" data-act="tick" data-r="${r.id}" data-id="${id}">
        <div class="check ${on?'on':''}">✓</div>
        <div class="body"><div class="title" style="font-size:15px;${on?'color:var(--muted)':''}">${esc(t.title)}</div></div>
      </button>`;
    });
    h += `</div>`;
  }
  return h + `</div>`;
}

/* ---------- Find ---------- */
function viewFind(){
  if(!findStack.length) findStack = [S.rootId];
  const node = S.nodes[findStack[findStack.length-1]];
  let h = `<div class="top"><div class="crumb">`;
  if(findStack.length>1) h += `<button data-act="findback">‹ Back</button>`;
  h += `${findStack.slice(0,-1).map(id=>esc(S.nodes[id].label)).join(' · ')}</div></div>`;

  h += `<input type="text" id="findq" placeholder="Search everything" value="${esc(findQuery)}" autocapitalize="none" autocorrect="off">`;

  if(findQuery.trim()){
    const q = findQuery.toLowerCase();
    const hits = Object.values(S.tools).filter(t =>
      (t.title+' '+(t.tags||[]).join(' ')+' '+(t.text||'')).toLowerCase().includes(q));
    h += `<div class="section"><h2>${hits.length} match${hits.length===1?'':'es'}</h2>`;
    hits.forEach(t=>{ h += toolRow(t); });
    if(!hits.length) h += `<div class="empty">Nothing matches. Try a body part, or the name of whoever you got it from.</div>`;
    return h + `</div>`;
  }

  h += `<div class="q">${esc(node.label)}</div>`;
  node.childIds.forEach(id=>{
    const c = S.nodes[id];
    const n = c.childIds.length + c.toolIds.length;
    h += `<button class="row" data-act="findinto" data-id="${id}">
      <div class="body"><div class="title">${esc(c.label)}</div>
      <div class="meta">${n? n+(c.childIds.length?' branches':' saved'):'Empty'}</div></div>
      <div class="chev">›</div></button>`;
  });
  node.toolIds.forEach(id=>{ const t = tool(id); if(t) h += toolRow(t); });
  if(!node.childIds.length && !node.toolIds.length){
    h += `<div class="empty"><b>Nothing here yet</b>Open Build → Question tree to add branches under “${esc(node.label)}”, or attach something from your library.</div>`;
  }
  return h;
}
function toolRow(t){
  return `<button class="row" data-act="playone" data-id="${t.id}">
    <div class="glyph">${KIND[t.kind].ic}</div>
    <div class="body"><div class="title">${esc(t.title)}</div><div class="meta">${esc(toolMeta(t))}</div></div>
    <div class="chev">›</div></button>`;
}

/* ---------- Library ---------- */
let libQuery = '';
function viewLibrary(){
  const all = Object.values(S.tools).sort((a,b)=>a.title.localeCompare(b.title));
  const q = libQuery.trim().toLowerCase();
  const list = q ? all.filter(t=>(t.title+' '+(t.tags||[]).join(' ')).toLowerCase().includes(q)) : all;
  let h = `<div class="top"><h1>Library</h1><div class="sub">${all.length} item${all.length===1?'':'s'}</div></div>
    <button class="btn" data-act="newtool">Add something</button>
    <div style="height:14px"></div>
    <input type="text" id="libq" placeholder="Search your library" value="${esc(libQuery)}" autocapitalize="none">
    <div class="section">`;
  if(!all.length){
    h += `<div class="empty"><b>Empty library</b>Save a video, a photo of a handout, or type out the cue you keep forgetting. Everything stays on this phone.</div>`;
  }
  list.forEach(t=>{
    h += `<div class="row">
      <div class="glyph">${KIND[t.kind].ic}</div>
      <button class="body" data-act="playone" data-id="${t.id}" style="text-align:left">
        <div class="title">${esc(t.title)}</div><div class="meta">${esc(toolMeta(t))}</div></button>
      <button class="chev" data-act="edittool" data-id="${t.id}" aria-label="Edit">⋯</button>
    </div>`;
  });
  return h + `</div>`;
}

/* ---------- Build ---------- */
function viewBuild(){
  let h = `<div class="top"><h1>Build</h1><div class="sub">Change anything here</div></div>`;
  h += `<div class="section"><h2>Question tree</h2>`;
  h += treeOutline(S.rootId, 0);
  h += `</div>`;

  h += `<div class="section"><h2>Routines</h2>`;
  S.routines.forEach(r=>{
    h += `<button class="row" data-act="editroutine" data-id="${r.id}">
      <div class="body"><div class="title">${esc(r.name)}</div>
      <div class="meta">${r.itemIds.length} item${r.itemIds.length===1?'':'s'} · ${r.days.length===7?'every day':(r.days.length?r.days.map(d=>DAYS[d]).join(' '):'no days set')}</div></div>
      <div class="chev">›</div></button>`;
  });
  h += `<button class="btn ghost" data-act="newroutine">New routine</button></div>`;

  h += `<div class="section"><h2>Backup</h2>
    <div class="hint">The export is your structure: branches, items, routines and history. Video and photo files stay on the phone because they are too large to travel in a text file, so keep the originals in Photos.</div>
    <div style="height:10px"></div>
    <div class="btnrow"><button class="btn ghost" data-act="export">Export plan</button>
    <button class="btn ghost" data-act="import">Import plan</button></div>
    <div class="hint" id="storagenote">Checking storage…</div></div>`;
  return h;
}
function treeOutline(id, depth){
  const n = S.nodes[id];
  let h = `<button class="row" data-act="editnode" data-id="${id}" style="margin-left:${depth*14}px">
    <div class="body"><div class="title" style="font-size:${depth?16:17}px">${esc(n.label)}</div>
    <div class="meta">${n.toolIds.length? n.toolIds.length+' attached':''}${n.toolIds.length&&n.childIds.length?' · ':''}${n.childIds.length? n.childIds.length+' below':''}${!n.toolIds.length&&!n.childIds.length?'Empty':''}</div></div>
    <div class="chev">⋯</div></button>`;
  n.childIds.forEach(c=>{ h += treeOutline(c, depth+1); });
  return h;
}

function currentKind(){ return $('#kindseg').querySelector('[aria-pressed=true]').dataset.k; }
function renderKindFields(kind, t){
  const box = $('#kindfields');

    box.innerHTML = `<label class="f"><span>Instructions</span><textarea id="t_text" placeholder="Tongue to roof of mouth. Lips closed, teeth apart. Breathe through the nose for ten breaths.">${esc(t.text||'')}</textarea></label>

    box.innerHTML = `<label class="f"><span>Photo${t.mediaId?' — a file is already saved':''}</span><input type="file" id="t_file" accept="image/*"></label>
      <label class="f"><span>Hold on screen for</span><input type="number" id="t_seconds" min="3" max="900" value="${t.seconds||30}"></label>
      <label class="f"><span>Notes shown underneath</span><textarea id="t_text" style="min-height:70px">${esc(t.text||'')}</textarea></label>`;

    box.innerHTML = `<label class="f"><span>Video${t.mediaId?' — a file is already saved':''}</span><input type="file" id="t_file" accept="video/*"></label>
      <label class="f"><span>Play it through this many times</span><input type="number" id="t_reps" min="1" max="20" value="${t.reps||1}"></label>
      <label class="f"><span>Or cut it off after this many seconds, 0 for the whole clip</span><input type="number" id="t_seconds" min="0" max="900" value="${t.seconds||0}"></label>`;

}
function readToolForm(prev){
  const kind = currentKind();
  return {
    ...prev, kind,
    title: ($('#t_title').value||'').trim(),
    tags: ($('#t_tags').value||'').split(',').map(s=>s.trim()).filter(Boolean),
    source: ($('#t_source').value||'').trim(),
    text: (document.getElementById('t_text')||{}).value || '',
    seconds: parseInt((document.getElementById('t_seconds')||{}).value||0,10) || 0,
    reps: parseInt((document.getElementById('t_reps')||{}).value||1,10) || 1
  };
}
async function saveTool(id){
  const prev = id ? S.tools[id] : {};
  const t = readToolForm(prev);
  if(!t.title){ alert('Give it a name so you can find it later.'); return; }
  if(draftFile) t.mediaId = await putMedia(draftFile);
  if(t.kind!=='text' && !t.mediaId){ alert('Choose a file, or switch this to Written.'); return; }
  if(t.kind==='text' && !t.text.trim()){ alert('Add the instructions.'); return; }
  if(t.kind!=='video' && !t.seconds) t.seconds = 30;
  t.id = id || uid();
  S.tools[t.id] = t;
  await save();
  closeSheet(); render();
}
async function deleteTool(id){
  if(!confirm('Delete this item everywhere it appears?')) return;
  const t = S.tools[id];
  if(t && t.mediaId) await idbDel('media', t.mediaId);
  delete S.tools[id];
  Object.values(S.nodes).forEach(n=>{ n.toolIds = n.toolIds.filter(x=>x!==id); });
  S.routines.forEach(r=>{ r.itemIds = r.itemIds.filter(x=>x!==id); });
  await save(); closeSheet(); render();
}

function addChild(id){
  stashNodeLabel(id);

  const c = { id:uid(), label:label.trim(), childIds:[], toolIds:[], parentId:id };
  S.nodes[c.id] = c; S.nodes[id].childIds.push(c.id);

function delNode(id){
  const n = S.nodes[id];
  if(n.childIds.length && !confirm('This removes everything nested under it. The library items themselves stay.')) return;
  const kill = x => { S.nodes[x].childIds.slice().forEach(kill); delete S.nodes[x]; };
  const p = S.nodes[n.parentId];
  p.childIds = p.childIds.filter(x=>x!==id);
  kill(id);
  save(); closeSheet(); render();
}

/* ---------- backup ---------- */
function exportPlan(){
  const blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ledger-plan-' + today() + '.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function importPlan(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='application/json,.json';
  inp.onchange = async () => {
    const f = inp.files[0]; if(!f) return;
    try{
      const parsed = JSON.parse(await f.text());
      if(!parsed.nodes || !parsed.rootId) throw new Error('bad');
      if(!confirm('Replace the current plan with this file? Saved video and photo files are kept.')) return;
      S = parsed; S.logs = S.logs||{};
      await save(); render();
    }catch(e){ alert('That file is not a Ledger plan.'); }
  };
  inp.click();
}
async function storageNote(){
  const el = document.getElementById('storagenote'); if(!el) return;
  let bits = [];
  try{
    if(navigator.storage && navigator.storage.persisted){
      const p = await navigator.storage.persisted();
      bits.push(p ? 'Storage is marked persistent.' : 'Storage is not marked persistent yet. Keep the app on your home screen and open it now and then.');
    }
    if(navigator.storage && navigator.storage.estimate){
      const e = await navigator.storage.estimate();
      if(e.usage) bits.push('Using about ' + (e.usage/1048576).toFixed(1) + ' MB.');
    }
  }catch(e){}
  el.textContent = bits.join(' ');
}

async function play(queue, routineId){
  if(!queue.length) return;
  P.queue = queue.slice(); P.i = 0; P.routineId = routineId||null; P.paused = false;
  $('#pdone').classList.remove('on'); $('#pfoot').style.display='flex';
  $('#player').classList.add('open');
  try{ if(navigator.wakeLock) P.wake = await navigator.wakeLock.request('screen'); }catch(e){}
  // Unlock the video element inside the user's tap, using a silent clip, so
  // later clips in the queue can start themselves without another tap.
  try{ const v = V(); v.muted=false; v.src = UNLOCK; const p = v.play(); if(p) p.catch(()=>{}); }catch(e){}
  step();
}
function closePlayer(){
  stopTimer();
  try{ V().pause(); V().removeAttribute('src'); V().load(); }catch(e){}
  if(P.wake){ try{ P.wake.release(); }catch(e){} P.wake=null; }
  $('#player').classList.remove('open');
  render();
}
function stopTimer(){
  clearTimeout(P.timer); P.timer=null;
  cancelAnimationFrame(P.raf); P.raf=null;
}
function setBar(f){ $('#pbar i').style.width = Math.max(0,Math.min(1,f))*100 + '%'; }

async function step(){
  stopTimer();
  const t = S.tools[P.queue[P.i]];
  if(!t){ finish(); return; }
  P.rep = 1;
  $('#pname').textContent = t.title;
  $('#pcount').textContent = (P.i+1) + ' / ' + P.queue.length;
  $('#ppaused').classList.remove('on');
  $('#ptoggle').textContent = 'Pause';
  const vid = V(), img = $('#pimg'), txt = $('#ptext'), txtb = $('#ptextbody');
  vid.style.display = img.style.display = 'none';
  txt.classList.remove('on','caption'); txtb.textContent = '';
  setBar(0);

  if(t.kind==='video'){
    const url = await mediaURL(t.mediaId);
    vid.style.display='block';
    vid.loop = false;
    vid.src = url;
    vid.currentTime = 0;
    const p = vid.play();
    if(p) p.catch(()=>{ P.paused = true; $('#ppaused').textContent='Tap to start this clip.'; $('#ppaused').classList.add('on'); });
    if(t.seconds>0) runTimer(t.seconds*1000);
    else tickVideo(t);
  } else if(t.kind==='image'){
    const url = await mediaURL(t.mediaId);
    img.src = url; img.style.display='block';
    if(t.text){ txtb.textContent = t.text; txt.classList.add('caption','on'); }
    runTimer((t.seconds||30)*1000);
  } else {
    txtb.textContent = t.text; txt.classList.add('on');
    runTimer((t.seconds||30)*1000);
  }
}
function tickVideo(t){
  const vid = V();
  const loop = () => {
    if(vid.duration) setBar(((P.rep-1) + vid.currentTime/vid.duration) / (t.reps||1));
    P.raf = requestAnimationFrame(loop);
  };
  loop();
  vid.onended = () => {
    if(P.rep < (t.reps||1)){ P.rep++; vid.currentTime = 0; vid.play().catch(()=>{}); }
    else next();
  };
}
function runTimer(ms){
  P.leftMs = ms; P.endsAt = Date.now() + ms;
  const total = ms;
  const loop = () => {
    const left = P.endsAt - Date.now();
    setBar(1 - left/total);
    if(left<=0){ next(); return; }
    P.raf = requestAnimationFrame(loop);
  };
  loop();
  P.timer = setTimeout(next, ms);
}
function togglePause(){
  const t = S.tools[P.queue[P.i]];
  P.paused = !P.paused;
  $('#ptoggle').textContent = P.paused ? 'Resume' : 'Pause';
  $('#ppaused').textContent = 'Paused. Tap to continue.';
  $('#ppaused').classList.toggle('on', P.paused);
  if(P.paused){
    if(t && t.kind==='video' && !t.seconds) V().pause();
    else { P.leftMs = Math.max(0, P.endsAt - Date.now()); stopTimer(); if(t&&t.kind==='video') V().pause(); }
  } else {
    if(t && t.kind==='video'){ V().play().catch(()=>{}); }
    if(!(t && t.kind==='video' && !t.seconds)) runTimer(P.leftMs||1000);
    else tickVideo(t);
  }
}
function next(){
  stopTimer();
  if(P.routineId) markDone(P.routineId, P.queue[P.i]);
  if(P.i >= P.queue.length-1){ finish(); return; }
  P.i++; P.paused=false; step();
}
function prev(){
  stopTimer();
  if(P.i===0){ step(); return; }
  P.i--; P.paused=false; step();
}
function finish(){
  stopTimer();
  try{ V().pause(); }catch(e){}
  V().style.display='none'; $('#pimg').style.display='none'; $('#ptext').classList.remove('on','caption');
  $('#ppaused').classList.remove('on');
  setBar(1);
  $('#pfoot').style.display='none';
  const name = P.routineId ? (S.routines.find(r=>r.id===P.routineId)||{}).name : null;
  $('#pdone').innerHTML = `<div style="font-family:var(--serif);font-size:30px;margin-bottom:6px">Done</div>
    <div style="color:var(--muted);margin-bottom:22px">${name? esc(name)+' is ticked off for today.' : 'That is the end of the queue.'}</div>
    <button class="btn" data-act="closeplayer">Close</button>`;
  $('#pdone').classList.add('on');
}

/* ============================================================
   Events
   ============================================================ */
document.addEventListener('click', async (e)=>{
  const closer = e.target.closest('[data-close]');
  if(closer){ closeSheet(); return; }
  const tabBtn = e.target.closest('#tabs button');
  if(tabBtn){ tab = tabBtn.dataset.tab; if(tab==='find'){ findQuery=''; } render(); if(tab==='build') storageNote(); return; }
  const el = e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  const id = el.dataset.id, act = el.dataset.act;

  switch(act){
    case 'playroutine': {
      const r = S.routines.find(x=>x.id===id);
      play(r.itemIds.filter(i=>S.tools[i]), r.id); break;
    }
    case 'playone': play([id], null); break;
    case 'tick': toggleDone(el.dataset.r, id); break;
    case 'findinto': findStack.push(id); render(); break;
    case 'findback': findStack.pop(); render(); break;
    case 'newtool': editTool(null); break;
    case 'edittool': editTool(id); break;
    case 'savetool': await saveTool(id||null); break;
    case 'deltool': await deleteTool(id); break;
    case 'editnode': editNode(id); break;
    case 'savenode': S.nodes[id].label = ($('#n_label').value||'').trim() || S.nodes[id].label; save(); closeSheet(); render(); break;
    case 'addchild': addChild(id); break;
    case 'delnode': delNode(id); break;
    case 'nodedetach': S.nodes[id].toolIds = S.nodes[id].toolIds.filter(x=>x!==el.dataset.t); save(); editNode(id); render(); break;
    case 'nodemove': {
      const arr = S.nodes[id].toolIds, i = arr.indexOf(el.dataset.t), d = +el.dataset.d;
      if(i+d>=0 && i+d<arr.length){ arr.splice(i+d,0,arr.splice(i,1)[0]); save(); editNode(id); }
      break;
    }
    case 'nodeshift': {
      const n = S.nodes[id], arr = S.nodes[n.parentId].childIds, i = arr.indexOf(id), d = +el.dataset.d;
      if(i+d>=0 && i+d<arr.length){ arr.splice(i+d,0,arr.splice(i,1)[0]); save(); editNode(id); render(); }
      break;
    }
    case 'attach': stashNodeLabel(id); pickTool(tid => { if(!S.nodes[id].toolIds.includes(tid)) S.nodes[id].toolIds.push(tid); save(); editNode(id); render(); }); break;
    case 'newroutine': editRoutine(null); break;
    case 'editroutine': editRoutine(id); break;
    case 'saveroutine': saveRoutine(id||null); break;
    case 'delroutine':
      if(confirm('Delete this routine? The items stay in your library.')){
        S.routines = S.routines.filter(x=>x.id!==id); save(); closeSheet(); render();
      } break;
    case 'attachroutine': {
      const back = id;
      stashRoutineForm();
      pickTool(tid => { _draftRoutine.itemIds.push(tid); reopenRoutine(back); });
      break;
    }
    case 'rmove': {
      const i=+el.dataset.i, d=+el.dataset.d, arr=_draftRoutine.itemIds;
      if(i+d>=0 && i+d<arr.length){ arr.splice(i+d,0,arr.splice(i,1)[0]); refreshRoutineItems(); }
      break;
    }
    case 'rdrop': _draftRoutine.itemIds.splice(+el.dataset.i,1); refreshRoutineItems(); break;
    case 'picked': { const cb=_onPick; _onPick=null; closeSheet(); cb && cb(id); break; }
    case 'export': exportPlan(); break;
    case 'import': importPlan(); break;
    case 'closeplayer': closePlayer(); break;
  }
});
function stashRoutineForm(){
  if(!_draftRoutine) return;
  const n = document.getElementById('r_name');
  if(n) _draftRoutine.name = n.value;
  const d = document.getElementById('r_days');
  if(d) _draftRoutine.days = [...d.children].filter(b=>b.getAttribute('aria-pressed')==='true').map(b=>+b.dataset.d);
}
function reopenRoutine(id){
  const keep = _draftRoutine;
  editRoutine(id||null);
  _draftRoutine = keep;
  const nameEl = $('#r_name'); if(nameEl && keep.name) nameEl.value = keep.name;
  [...$('#r_days').children].forEach(b=>b.setAttribute('aria-pressed', keep.days.includes(+b.dataset.d)));
  refreshRoutineItems();
}
document.addEventListener('input', e=>{
  if(e.target.id==='findq'){ findQuery = e.target.value; const p=document.activeElement; render();
    const f=$('#findq'); if(f){ f.focus(); f.setSelectionRange(f.value.length,f.value.length); } }
  if(e.target.id==='libq'){ libQuery = e.target.value; render();
    const f=$('#libq'); if(f){ f.focus(); f.setSelectionRange(f.value.length,f.value.length); } }
});
$('#pclose').onclick = closePlayer;
$('#pnext').onclick = next;
$('#pprev').onclick = prev;
$('#ptoggle').onclick = togglePause;
$('#ptap').onclick = () => {
  const t = S.tools[P.queue[P.i]];
  if(P.paused && t && t.kind==='video'){ V().play().catch(()=>{}); }
  togglePause();
};
$('#pmute').onclick = () => {
  const v = V(); v.muted = !v.muted;
  $('#pmute').textContent = v.muted ? '⊘' : '♪';
};

/* ---------- boot ---------- */
(async function(){
  await loadState();
  try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  render();
  if('serviceWorker' in navigator){
    try{ navigator.serviceWorker.register('sw.js'); }catch(e){}
  }
})();

</script>
